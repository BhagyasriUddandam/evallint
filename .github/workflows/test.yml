name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix deliberately installs the CORE package only — no [embeddings]
  # extra, so no torch. That keeps four jobs at ~1s of test time instead of
  # pulling ~2GB each, and it continuously proves the thing the packaging
  # decision claims: evallint is fully usable without the heavy dependency.
  # The 3 real-model tests skip cleanly here; the `full` job below runs them.
  core:
    name: core (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an EXACT version, not @v10. astral-sh/setup-uv publishes
        # floating major tags only up to v7 -- there is no v8/v9/v10 moving tag,
        # so `@v10` is an unresolvable ref and every job dies at "Set up job"
        # before a single step runs. An exact pin is also the more reproducible
        # choice: the action cannot change under us between runs.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install core package + test runner only
        # Deliberately NOT `uv sync`, and deliberately NOT `uv run` below.
        # `uv sync` installs the dev group; `uv run` AUTO-SYNCS it, and the dev
        # group contains sentence-transformers. Either would drag torch in and
        # quietly turn this into a full install that still called itself "core".
        # Calling the venv's interpreter directly has no such behaviour.
        run: |
          uv venv
          uv pip install -e . pytest

      - name: Assert the core install really has no torch
        # Guards the packaging decision from silently regressing. If someone
        # moves sentence-transformers back into [project.dependencies], this
        # fails here rather than surprising users with a 2GB download.
        shell: bash
        run: |
          if .venv/bin/python -c "import torch" 2>/dev/null; then
            echo "::error::torch is present in a CORE install — sentence-transformers leaked into [project.dependencies]"
            exit 1
          fi
          echo "confirmed: no torch in the core install"

      - name: Record the exact environment
        # This job has failed intermittently on one runner (macos/py3.12: 2 of
        # its first 4 executions) while passing everywhere else and never
        # reproducing locally on the same OS and Python. Print what the runner
        # actually resolved, so the next occurrence can be compared against a
        # green one instead of guessed at.
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import platform, sys
          import numpy
          print("python  ", sys.version.split()[0], "|", sys.executable)
          print("platform", platform.platform(), "|", platform.machine())
          print("numpy   ", numpy.__version__)
          PY

      - name: Run tests
        # Job logs require admin rights to read through the API, but ANNOTATIONS
        # are public. An intermittent failure whose output nobody can read is
        # untriageable, so on failure the tail of the pytest output is emitted as
        # an annotation. -ra also lists skip reasons, and the exit code is
        # reported explicitly: a plain non-zero from a named FAILED test is a
        # test bug, while 134/139 with no FAILED lines is a native crash, and
        # those need completely different fixes.
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest -q -ra --tb=short > pytest.log 2>&1
          code=$?
          set -e
          cat pytest.log
          if [ "$code" -ne 0 ]; then
            detail=$(tail -25 pytest.log | tr '\n' '~' | sed 's/%/%25/g; s/\r/ /g')
            echo "::error title=pytest exit ${code} on ${{ matrix.os }} py${{ matrix.python }}::${detail}"
            exit "$code"
          fi

      - name: Smoke-test the CLI, and assert a partial audit exits 3
        # This step used to be a bare `evallint examples/...` and it FAILED --
        # correctly. On a core install sentence-transformers is absent, so the
        # duplicate check cannot load, so the run is a 1-of-2 audit and exits 3
        # by design: "I could not finish" must never be reported as "clean".
        # So assert the contract instead of dodging it. --skip-duplicates is the
        # documented way to choose this scope deliberately, and exits 0.
        shell: bash
        run: |
          .venv/bin/evallint examples/sample_evalset.jsonl --skip-duplicates
          set +e
          .venv/bin/evallint examples/sample_evalset.jsonl >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "3" ]; then
            echo "::error::a core install cannot run the duplicate check, so a bare run must exit 3 (incomplete audit); got $code"
            exit 1
          fi
          echo "confirmed: bare run exits 3, --skip-duplicates exits 0"

  # One job with the optional extra, so the two end-to-end embedding tests
  # actually execute somewhere. Ubuntu + oldest supported Python is enough:
  # the thing under test is the model integration, not the platform.
  full:
    name: full (with [embeddings])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an EXACT version, not @v10. astral-sh/setup-uv publishes
        # floating major tags only up to v7 -- there is no v8/v9/v10 moving tag,
        # so `@v10` is an unresolvable ref and every job dies at "Set up job"
        # before a single step runs. An exact pin is also the more reproducible
        # choice: the action cannot change under us between runs.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache the sentence-transformers model
        # ~90MB of weights, downloaded on first use. Caching keeps this job
        # from re-fetching them on every run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install everything (dev group includes the extra)
        run: uv sync

      - name: Run tests, failing if the real-model tests were skipped
        # A silent skip here would mean the embedding path is untested while CI
        # still reports green — the exact class of quiet failure this project
        # is about. -r a lists skip reasons in the log.
        run: |
          uv run pytest -q -ra | tee result.txt
          if grep -qE "^[0-9]+ passed, [0-9]+ skipped" result.txt; then
            echo "::error::tests were skipped in the full job — the real-model tests did not run"
            grep -E "SKIPPED" result.txt || true
            exit 1
          fi

  # Proves the artifacts are publishable on every push, not just at release
  # time. A packaging error found here is free; found during a release it
  # burns a version number permanently.
  build:
    name: build + validate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an EXACT version, not @v10. astral-sh/setup-uv publishes
        # floating major tags only up to v7 -- there is no v8/v9/v10 moving tag,
        # so `@v10` is an unresolvable ref and every job dies at "Set up job"
        # before a single step runs. An exact pin is also the more reproducible
        # choice: the action cannot change under us between runs.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      - name: Install the built wheel in a clean venv and use it
        # Tests the ARTIFACT, not the source tree. Catches missing package
        # data (py.typed), a broken console script, or an import that only
        # works from the repo root.
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          # --skip-duplicates for the same reason as the core job: the wheel is
          # installed WITHOUT the [embeddings] extra, so a bare run is a partial
          # audit and exits 3 on purpose.
          /tmp/fresh/bin/evallint examples/sample_evalset.jsonl --skip-duplicates
          /tmp/fresh/bin/python -c "
          import evallint, pathlib
          assert (pathlib.Path(evallint.__file__).parent / 'py.typed').is_file(), 'py.typed missing from the wheel'
          assert evallint.__version__, 'version not readable from metadata'
          print('wheel OK:', evallint.__version__, '|', len(evallint.__all__), 'exports')
          "

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
